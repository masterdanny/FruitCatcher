<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Fruit</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #score, #highScore, #lives, #combo {
            font-size: 24px;
            margin: 10px;
        }
        #gameCanvas {
            border: 1px solid #ffffff;
            display: block;
            margin: 0 auto;
            background-color: #282c34;
            max-width: 100%;
            max-height: 100vh;
        }
        #restart, #pause, #resume {
            display: none;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            z-index: 1000; /* Ensure button is above canvas */
            position: relative;
            background-color: #1a7e20;
            color: white;
            border: none;
            border-radius: 5px;
            touch-action: manipulation; /* Prevent touch interference */
        }
        #restart:hover, #pause:hover, #resume:hover {
            background-color: #166d1c;
        }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <div id="highScore">High Score: 0</div>
    <div id="lives">Lives: 3</div>
    <div id="combo">Combo: 1x</div>
    <canvas id="gameCanvas"></canvas>
    <button id="restart">Restart Game</button>
    <button id="pause">Pause</button>
    <button id="resume" style="display: none;">Resume</button>
    <script>
        'use strict';

        class Fruit {
            constructor(canvas, fruitChars, score) {
                this.canvas = canvas;
                this.fruitChars = fruitChars;
                this.score = score;
                this.width = 30;
                this.height = 30;
                this.x = Math.random() * (this.canvas.width - this.width);
                this.y = 0;
                this.speed = this.calculateSpeed();
                this.char = '';
                this.type = '';
                this.setRandomType();
            }

            calculateSpeed() {
                const difficultyFactor = 1 + Math.floor(this.score / 100) * 0.1;
                return ((window.innerWidth > 1200 ? 4 : 2) + Math.random() * 2) * difficultyFactor;
            }

            setRandomType() {
                const rand = Math.random();
                if (rand < 0.03) {
                    this.char = '✨';
                    this.type = 'grow';
                } else if (rand < 0.06) {
                    this.char = '💨';
                    this.type = 'shrink';
                } else if (rand < 0.09) {
                    this.char = '🥶';
                    this.type = 'slowmo';
                } else if (rand < 0.12) {
                    this.char = '❤️';
                    this.type = 'life';
                } else if (rand < 0.27) {
                    this.char = '💣';
                    this.type = 'bomb';
                } else {
                    this.char = this.fruitChars[Math.floor(Math.random() * this.fruitChars.length)];
                    this.type = 'fruit';
                }
            }

            draw(ctx) {
                try {
                    ctx.font = `${this.width}px serif`;
                    ctx.fillText(this.char, this.x, this.y + this.height);
                } catch (e) {
                    console.error('Error drawing fruit:', e);
                }
            }

            update(isSlowMoActive) {
                this.y += isSlowMoActive ? this.speed / 2 : this.speed;
            }
        }

        class Basket {
            constructor(canvas) {
                this.canvas = canvas;
                this.width = 100;
                this.height = 30;
                this.speed = 10;
                this.originalWidth = 100;
                this.isPoweredUp = false;
                this.powerUpType = null;
                this.powerUpTimer = 0;
                this.x = this.canvas.width / 2 - this.width / 2;
                this.y = this.canvas.height - 30;
            }

            draw(ctx) {
                try {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    // Main basket body
                    ctx.fillStyle = '#8B4513'; // SaddleBrown
                    ctx.beginPath();
                    ctx.moveTo(0, this.height);
                    ctx.lineTo(this.width, this.height);
                    ctx.quadraticCurveTo(this.width * 0.9, 0, this.width * 0.7, 0);
                    ctx.lineTo(this.width * 0.3, 0);
                    ctx.quadraticCurveTo(this.width * 0.1, 0, 0, this.height);
                    ctx.closePath();
                    ctx.fill();

                    // Basket rim (top edge)
                    ctx.fillStyle = '#A0522D'; // Sienna
                    ctx.beginPath();
                    ctx.ellipse(this.width / 2, 5, this.width / 2, 5, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                } catch (e) {
                    console.error('Error drawing basket:', e);
                }
            }

            update(leftPressed, rightPressed) {
                if (leftPressed && this.x > 0) {
                    this.x -= this.speed;
                }
                if (rightPressed && this.x < this.canvas.width - this.width) {
                    this.x += this.speed;
                }
            }

            reset() {
                this.width = this.originalWidth;
                this.isPoweredUp = false;
                this.powerUpType = null;
                this.powerUpTimer = 0;
                this.x = this.canvas.width / 2 - 50;
            }
        }

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.scoreDisplay = document.getElementById('score');
                this.highScoreDisplay = document.getElementById('highScore');
                this.livesDisplay = document.getElementById('lives');
                this.comboDisplay = document.getElementById('combo');
                this.restartButton = document.getElementById('restart');
                this.pauseButton = document.getElementById('pause');
                this.resumeButton = document.getElementById('resume');

                this.basket = new Basket(this.canvas);
                this.score = 0;
                this.highScore = localStorage.getItem('fruitCatcherHighScore') || 0;
                this.lives = 3;
                this.combo = 1;
                this.gameOver = false;
                this.isPaused = false;
                this.animationFrameId = null;
                this.activeAnimations = [];
                this.isSlowMoActive = false;
                this.slowMoTimer = 0;
                this.fruitChars = ['🍎', '🍊', '🍌', '🍉', '🍇', '🍓'];
                this.fruits = [];
                this.fruitSpawnTimer = 0;
                this.leftPressed = false;
                this.rightPressed = false;

                this.highScoreDisplay.textContent = `High Score: ${this.highScore}`;

                try {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.warn("Web Audio API is not supported in this browser");
                }

                this.resizeCanvas = this.resizeCanvas.bind(this);
                this.draw = this.draw.bind(this);
                this.restartGame = this.restartGame.bind(this);

                window.addEventListener('resize', this.resizeCanvas);
                this.resizeCanvas();
            }

            playSound(type) {
                if (!this.audioCtx) return;

                const oscillator = this.audioCtx.createOscillator();
                const gainNode = this.audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(this.audioCtx.destination);

                if (type === 'catch') {
                    oscillator.frequency.value = 800;
                    gainNode.gain.setValueAtTime(0.2, this.audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.2);
                } else if (type === 'miss') {
                    oscillator.type = 'square';
                    oscillator.frequency.value = 100;
                    gainNode.gain.setValueAtTime(0.2, this.audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.3);
                } else if (type === 'gameOver') {
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.value = 150;
                    gainNode.gain.setValueAtTime(0.3, this.audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.5);
                } else if (type === 'life') {
                    oscillator.frequency.value = 1200;
                    gainNode.gain.setValueAtTime(0.2, this.audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.3);
                } else if (type === 'powerup') {
                    oscillator.frequency.value = 600;
                    oscillator.type = 'triangle';
                    gainNode.gain.setValueAtTime(0.2, this.audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.3);
                }

                oscillator.start(this.audioCtx.currentTime);
                oscillator.stop(this.audioCtx.currentTime + 0.5);
            }

            initAudio() {
                document.body.addEventListener('click', () => {
                    if (this.audioCtx && this.audioCtx.state === 'suspended') {
                        this.audioCtx.resume();
                    }
                }, { once: true });
                document.body.addEventListener('keydown', () => {
                    if (this.audioCtx && this.audioCtx.state === 'suspended') {
                        this.audioCtx.resume();
                    }
                }, { once: true });
                document.body.addEventListener('touchstart', () => {
                    if (this.audioCtx && this.audioCtx.state === 'suspended') {
                        this.audioCtx.resume();
                    }
                }, { once: true });
            }

            createFruit() {
                this.fruits.push(new Fruit(this.canvas, this.fruitChars, this.score));
            }

            initControls() {
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') {
                        this.leftPressed = true;
                    } else if (e.key === 'ArrowRight') {
                        this.rightPressed = true;
                    } else if (e.code === 'Space') {
                        e.preventDefault(); // Prevent page scroll
                        if (this.gameOver) {
                            this.restartGame();
                        } else {
                            if (this.isPaused) {
                                this.resumeButton.click();
                            } else {
                                this.pauseButton.click();
                            }
                        }
                    } else if (e.key === 'r' || e.key === 'R') {
                        this.restartGame();
                    }
                });

                document.addEventListener('keyup', (e) => {
                    if (e.key === 'ArrowLeft') this.leftPressed = false;
                    if (e.key === 'ArrowRight') this.rightPressed = false;
                });

                document.addEventListener('touchstart', (e) => {
                    if (this.gameOver && e.target === this.restartButton) return;
                    e.preventDefault();
                    const touch = e.touches[0];
                    const touchX = touch.clientX;
                    this.leftPressed = touchX < window.innerWidth / 2;
                    this.rightPressed = touchX >= window.innerWidth / 2;
                });

                document.addEventListener('touchend', (e) => {
                    if (e.target === this.restartButton) return;
                    e.preventDefault();
                    this.leftPressed = false;
                    this.rightPressed = false;
                });
            }

            restartGame() {
                cancelAnimationFrame(this.animationFrameId);
                this.score = 0;
                this.lives = 3;
                this.combo = 1;
                this.gameOver = false;
                this.isPaused = false;
                this.isSlowMoActive = false;
                this.slowMoTimer = 0;
                this.scoreDisplay.textContent = `Score: ${this.score}`;
                this.livesDisplay.textContent = `Lives: ${this.lives}`;
                this.comboDisplay.textContent = `Combo: ${this.combo}x`;
                this.basket.reset();
                this.fruits = [];
                this.fruitSpawnTimer = 0;
                this.activeAnimations = [];
                this.createFruit();
                this.restartButton.style.display = 'none';
                this.pauseButton.style.display = 'inline-block';
                this.resumeButton.style.display = 'none';
                this.draw();
            }

            initButtons() {
                this.restartButton.addEventListener('click', this.restartGame);
                this.restartButton.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.restartGame();
                });

                this.pauseButton.addEventListener('click', () => {
                    if (!this.gameOver) {
                        this.isPaused = true;
                        this.pauseButton.style.display = 'none';
                        this.resumeButton.style.display = 'inline-block';
                        cancelAnimationFrame(this.animationFrameId);
                    }
                });

                this.resumeButton.addEventListener('click', () => {
                    if (!this.gameOver) {
                        this.isPaused = false;
                        this.pauseButton.style.display = 'inline-block';
                        this.resumeButton.style.display = 'none';
                        this.draw();
                    }
                });
            }

            drawFruits() {
                for (const fruit of this.fruits) {
                    fruit.draw(this.ctx);
                }
            }

            updateFruits() {
                if (this.gameOver) return;

                const spawnRate = Math.max(30, 80 - Math.floor(this.score / 50));
                this.fruitSpawnTimer++;
                if (this.fruitSpawnTimer > spawnRate) {
                    this.createFruit();
                    this.fruitSpawnTimer = 0;
                }

                for (let i = this.fruits.length - 1; i >= 0; i--) {
                    const fruit = this.fruits[i];
                    fruit.update(this.isSlowMoActive);

                    if (
                        fruit.x + fruit.width > this.basket.x &&
                        fruit.x < this.basket.x + this.basket.width &&
                        fruit.y + fruit.height > this.basket.y &&
                        fruit.y < this.basket.y + this.basket.height
                    ) {
                        if (fruit.type === 'fruit') {
                            this.score += 10 * this.combo;
                            this.combo++;
                            this.comboDisplay.textContent = `Combo: ${this.combo}x`;
                            this.scoreDisplay.textContent = `Score: ${this.score}`;
                            this.playSound('catch');
                        } else if (fruit.type === 'bomb') {
                            this.lives--;
                            this.livesDisplay.textContent = `Lives: ${this.lives}`;
                            this.combo = 1;
                            this.comboDisplay.textContent = `Combo: ${this.combo}x`;
                            this.playSound('miss');
                        } else if (fruit.type === 'life') {
                            this.lives++;
                            this.livesDisplay.textContent = `Lives: ${this.lives}`;
                            this.playSound('life');
                        } else if (fruit.type === 'grow' || fruit.type === 'shrink') {
                            this.basket.width = this.basket.originalWidth;
                            this.basket.isPoweredUp = true;
                            this.basket.powerUpType = fruit.type;
                            this.basket.powerUpTimer = 300;
                            if (fruit.type === 'grow') {
                                this.basket.width = this.basket.originalWidth * 1.5;
                            } else {
                                this.basket.width = this.basket.originalWidth * 0.5;
                            }
                            this.playSound('powerup');
                        } else if (fruit.type === 'slowmo') {
                            this.isSlowMoActive = true;
                            this.slowMoTimer = 300;
                            this.playSound('powerup');
                        }
                        this.activeAnimations.push({
                            x: fruit.x,
                            y: fruit.y,
                            char: fruit.char,
                            type: fruit.type,
                            width: fruit.width,
                            height: fruit.height,
                            start_time: performance.now(),
                            duration: 300
                        });
                        this.fruits.splice(i, 1);
                    } else if (fruit.y > this.canvas.height) {
                        if (fruit.type === 'fruit') {
                            this.lives--;
                            this.livesDisplay.textContent = `Lives: ${this.lives}`;
                            this.combo = 1;
                            this.comboDisplay.textContent = `Combo: ${this.combo}x`;
                            this.playSound('miss');
                        }
                        this.fruits.splice(i, 1);
                    }
                }

                if (this.lives <= 0 && !this.gameOver) {
                    this.gameOver = true;
                    if (this.score > this.highScore) {
                        this.highScore = this.score;
                        localStorage.setItem('fruitCatcherHighScore', this.highScore);
                        this.highScoreDisplay.textContent = `High Score: ${this.highScore}`;
                    }
                    this.playSound('gameOver');
                    this.restartButton.style.display = 'block';
                    this.pauseButton.style.display = 'none';
                    this.resumeButton.style.display = 'none';
                    cancelAnimationFrame(this.animationFrameId);
                }
            }

            drawAnimations() {
                const currentTime = performance.now();
                for (let i = this.activeAnimations.length - 1; i >= 0; i--) {
                    const anim = this.activeAnimations[i];
                    const elapsed = currentTime - anim.start_time;
                    const progress = elapsed / anim.duration;

                    if (progress >= 1) {
                        this.activeAnimations.splice(i, 1);
                        continue;
                    }

                    this.ctx.save();
                    this.ctx.font = `${anim.width + (anim.width * progress * 0.5)}px serif`;
                    this.ctx.textAlign = 'center';
                    this.ctx.globalAlpha = 1 - progress;

                    const currentX = anim.x + anim.width / 2;
                    const currentY = anim.y + anim.height / 2 - (anim.height * progress * 0.5);
                    this.ctx.fillText(anim.char, currentX, currentY);
                    this.ctx.restore();
                }
            }

            draw() {
                if (this.isPaused) {
                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    this.ctx.fillStyle = 'white';
                    this.ctx.font = `${Math.min(this.canvas.width / 10, 60)}px Arial`;
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('Paused', this.canvas.width / 2, this.canvas.height / 2);
                    return;
                }
                if (this.gameOver) {
                    try {
                        this.ctx.fillStyle = 'white';
                        this.ctx.font = `${Math.min(this.canvas.width / 16, 48)}px Arial`;
                        this.ctx.textAlign = 'center';
                        this.ctx.fillText('Game Over!', this.canvas.width / 2, this.canvas.height / 2);
                        this.ctx.fillText(`Final Score: ${this.score}`, this.canvas.width / 2, this.canvas.height / 2 + Math.min(this.canvas.width / 16, 50));
                    } catch (e) {
                        console.error('Error rendering game over screen:', e);
                    }
                    return;
                }

                try {
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                    this.basket.draw(this.ctx);
                    this.drawFruits();
                    this.updatePowerUps();
                    this.basket.update(this.leftPressed, this.rightPressed);
                    this.updateFruits();
                    this.drawAnimations();
                    this.animationFrameId = requestAnimationFrame(this.draw);
                } catch (e) {
                    console.error('Error in game loop:', e);
                    cancelAnimationFrame(this.animationFrameId);
                }
            }

            updatePowerUps() {
                if (this.basket.isPoweredUp) {
                    this.basket.powerUpTimer--;
                    if (this.basket.powerUpTimer <= 0) {
                        this.basket.isPoweredUp = false;
                        this.basket.powerUpType = null;
                        this.basket.width = this.basket.originalWidth;
                    }
                }
                if (this.isSlowMoActive) {
                    this.slowMoTimer--;
                    if (this.slowMoTimer <= 0) {
                        this.isSlowMoActive = false;
                    }
                }
            }

            resizeCanvas() {
                const maxWidth = window.innerWidth * 0.8;
                const maxHeight = window.innerHeight * 0.8;
                const aspectRatio = window.innerHeight > window.innerWidth ? 5 / 6 : 4 / 3;
                let width = maxWidth;
                let height = width / aspectRatio;

                if (height > maxHeight) {
                    height = maxHeight;
                    width = height * aspectRatio;
                }

                this.canvas.width = width;
                this.canvas.height = height;

                const newOriginalWidth = this.canvas.width / 8;
                this.basket.originalWidth = newOriginalWidth;

                if (this.basket.isPoweredUp) {
                    if (this.basket.powerUpType === 'grow') {
                        this.basket.width = newOriginalWidth * 1.5;
                    } else if (this.basket.powerUpType === 'shrink') {
                        this.basket.width = newOriginalWidth * 0.5;
                    }
                } else {
                    this.basket.width = newOriginalWidth;
                }
                this.basket.x = this.canvas.width / 2 - this.basket.width / 2;
                this.basket.y = this.canvas.height - 30;
            }

            start() {
                this.initAudio();
                this.initControls();
                this.initButtons();
                this.createFruit();
                this.pauseButton.style.display = 'inline-block';
                this.draw();
            }
        }

        const game = new Game();
        game.start();

    </script>
</body>
</html>
